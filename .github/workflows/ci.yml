name: Verify deployment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elo_test
          POSTGRES_PASSWORD: integration-only-not-a-production-secret
          POSTGRES_DB: elo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U elo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://elo_test:integration-only-not-a-production-secret@127.0.0.1:5432/elo_test
      DIRECT_DATABASE_URL: postgresql://elo_test:integration-only-not-a-production-secret@127.0.0.1:5432/elo_test
      TEST_DATABASE_URL: postgresql://elo_test:integration-only-not-a-production-secret@127.0.0.1:5432/elo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:engine-rules
      - run: npm run test:engine-invariants
      - run: npm test
      - run: npm run build
      - run: npm run build:backend
      - run: npm run test:harness-isolation
      - run: npm run test:legacy-import
        env:
          ELO_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm run test:readiness
      - run: npm run test:integration
      - run: npm run test:account-sessions
      - run: npm run test:google-auth
      - run: npm run test:session-resume
      - run: npm run test:leaderboard
      - run: npm run test:ranked-integrity
      - run: npm run test:settlement-crash
      - run: npm run smoke:production
