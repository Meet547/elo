# Free prototype backend. External managed Postgres is configured in the dashboard.
# No paid disk or managed database is created by this Blueprint.
services:
  - type: web
    name: elo-backend
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BACKEND_PROXY_SECRET
        sync: false
